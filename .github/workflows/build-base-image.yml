name: Build and Publish Base Image

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                target:
                    - image_name: ghcr.io/${{ github.repository_owner }}/swift-vapor-runtime-base
                      cache_ref: ghcr.io/${{ github.repository_owner }}/swift-vapor-runtime-base:buildcache
                      dockerfile: ./Dockerfile
                    - image_name: ghcr.io/${{ github.repository_owner }}/swift-vapor-build-base
                      cache_ref: ghcr.io/${{ github.repository_owner }}/swift-vapor-build-base:buildcache
                      dockerfile: ./build/Dockerfile
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ matrix.target.image_name }}
                  tags: |
                      type=raw,value=latest
                      type=sha

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.target.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=${{ matrix.target.cache_ref }}
                  cache-to: type=registry,ref=${{ matrix.target.cache_ref }},mode=max
